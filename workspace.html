<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>(function(){try{var t=localStorage.getItem("litrix-theme");if(t==="dark"||t==="light")document.documentElement.setAttribute("data-theme",t);}catch(e){}})();</script>
<title>Company Workspace | Litrix</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Serif:wght@600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<header class="site-header">
  <div class="container-wide">
    <a class="wordmark" href="/">Litrix<span class="article4">Article 4 · AI Literacy</span></a>
    <nav class="site-nav">
      <a href="#" id="logout-link">Log out</a>
      <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Toggle theme"></button>
    </nav>
  </div>
</header>

<main class="container-wide" style="padding: 48px 24px 70px;">
  <div id="workspace-content" class="dossier">Loading workspace&hellip;</div>
</main>

<footer class="site-footer">
  <div class="container"><p>Litrix &middot; EU AI Act Article 4 compliance and literacy platform</p></div>
</footer>

<script src="/js/theme.js"></script>
<script src="/js/workspace.js"></script>
<script>
document.getElementById("logout-link").addEventListener("click", async (e) => {
  e.preventDefault();
  await fetch("/api/auth/logout", { method: "POST" });
  window.location.href = "/";
});
</script>
</body>
</html>
