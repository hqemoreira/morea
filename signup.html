<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>(function(){try{var t=localStorage.getItem("litrix-theme");if(t==="dark"||t==="light")document.documentElement.setAttribute("data-theme",t);}catch(e){}})();</script>
<title>Create Your Account | Litrix</title>
<meta name="description" content="Create a Litrix account to keep a permanent, verifiable Article 4 training register for yourself or your company.">
<link rel="canonical" href="https://litrix.eu/signup.html">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Serif:wght@600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<header class="site-header">
  <div class="container-wide">
    <a class="wordmark" href="/">Litrix<span class="article4">Article 4 · AI Literacy</span></a>
    <nav class="site-nav">
      <a href="/login.html">Log in</a>
      <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Toggle theme"></button>
    </nav>
  </div>
</header>

<main class="container" style="max-width:520px; padding: 48px 24px 70px;">
  <h1 id="page-title">Create your account</h1>
  <p id="page-sub" class="faint"></p>

  <form id="signup-form" class="dossier">
    <div id="account-type-field">
      <label>Account type</label>
      <label class="option-row"><input type="radio" name="accountType" value="individual" checked> Individual — €19</label>
      <label class="option-row"><input type="radio" name="accountType" value="company"> Company — €99–299/mo</label>
    </div>

    <div id="company-name-field" style="display:none;">
      <label for="companyName">Company name</label>
      <input type="text" id="companyName" name="companyName">
    </div>

    <label for="name">Your name</label>
    <input type="text" id="name" name="name" required>

    <label for="email">Email</label>
    <input type="email" id="email" name="email" required>

    <label for="password">Password</label>
    <input type="password" id="password" name="password" minlength="8" required>

    <div id="form-error"></div>

    <button type="submit" class="btn btn-primary btn-block">Create account</button>
  </form>

  <p class="faint" style="margin-top:16px;">Already have an account? <a href="/login.html">Log in</a></p>
</main>

<footer class="site-footer">
  <div class="container"><p>Litrix &middot; EU AI Act Article 4 compliance and literacy platform</p></div>
</footer>

<script>
const params = new URLSearchParams(window.location.search);
const inviteToken = params.get("invite");
const form = document.getElementById("signup-form");

if (inviteToken) {
  document.getElementById("page-title").textContent = "Join your company's workspace";
  document.getElementById("page-sub").textContent = "You've been invited to join a Litrix company register.";
  document.getElementById("account-type-field").style.display = "none";
  document.getElementById("company-name-field").style.display = "none";
}

document.querySelectorAll('input[name="accountType"]').forEach((input) => {
  input.addEventListener("change", () => {
    document.getElementById("company-name-field").style.display = input.value === "company" && input.checked ? "block" : "none";
  });
});

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  const errorEl = document.getElementById("form-error");
  errorEl.innerHTML = "";

  const payload = {
    name: document.getElementById("name").value,
    email: document.getElementById("email").value,
    password: document.getElementById("password").value
  };

  let url = "/api/auth/signup";
  if (inviteToken) {
    url = "/api/company/join";
    payload.token = inviteToken;
  } else {
    const accountType = document.querySelector('input[name="accountType"]:checked').value;
    payload.accountType = accountType;
    if (accountType === "company") {
      payload.companyName = document.getElementById("companyName").value;
    }
  }

  const res = await fetch(url, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(payload)
  });
  const data = await res.json();

  if (!res.ok) {
    errorEl.innerHTML = '<div class="notice notice-error">' + (data.error || "Something went wrong.") + "</div>";
    return;
  }

  if (sessionStorage.getItem("litrix_quiz")) {
    window.location.href = "/register.html";
  } else if (data.user && data.user.company_id) {
    window.location.href = "/workspace.html";
  } else {
    window.location.href = "/";
  }
});
</script>
<script src="/js/theme.js"></script>
</body>
</html>
